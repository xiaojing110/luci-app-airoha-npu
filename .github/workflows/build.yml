name: 编译luci-app-airoha-npu

on:
  workflow_dispatch:

jobs:
 build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: 下载工具链
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          wget -qO /opt/sdk.tar.xz https://downloads.openwrt.org/releases/22.03.5/targets/rockchip/armv8/openwrt-sdk-22.03.5-rockchip-armv8_gcc-11.2.0_musl.Linux-x86_64.tar.xz
          tar -xJf /opt/sdk.tar.xz -C /opt
          cd /opt/openwrt-sdk*
          # 整个仓库就是包本身：把检出的工作区放进 package/，不要再套一层子目录
          rm -rf package/luci-app-airoha-npu
          cp -R "$GITHUB_WORKSPACE" package/luci-app-airoha-npu
          rm -rf package/luci-app-airoha-npu/.git
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
      - name: 开始编译
        run: |
          cd /opt/openwrt-sdk*
          make package/luci-app-airoha-npu/compile V=s -j1
          # po/ 下每种语言都会额外生成一个 luci-i18n-airoha-npu-<lang> 包；
          # 旧版 LuCI 的 luci.mk 不认识某个语言码时会跳过，所以这里不强制
          make package/luci-i18n-airoha-npu-es/compile V=s -j1 || true
          make package/luci-i18n-airoha-npu-zh_Hans/compile V=s -j1 || true
          find bin/packages -name '*.ipk' | sort
          echo "build_time=$(date '+%Y年%m月%d日%H:%M:%S' | jq -sRr @uri)" >> $GITHUB_ENV
          echo "tag=$(date '+%Y-%m-%d')" >> $GITHUB_ENV
      - name: 发布
        uses: softprops/action-gh-release@v1
        with:
            token: ${{ secrets.c8 }}
            body: |
             > ![](https://img.shields.io/badge/%E7%BC%96%E8%AF%91%E6%97%B6%E9%97%B4-${{ env.build_time }}-8267?logo=github&labelColor=%E9%A1%BB)![](https://img.shields.io/github/downloads/${{ github.repository }}/${{ env.tag }}/total?label=%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&logo=github)


               **可从[LEDE仓库](http://mirrors.cloud.tencent.com/lede/) 、[ ImmortalWrt仓库 ](https://mirrors.vsean.net/openwrt/) 找到对应的版本对应的CPU架构**
               **luci-app-airoha-npu_*.ipk 是主程序；luci-i18n-airoha-npu-*.ipk 是语言包，中文界面需要装 luci-i18n-airoha-npu-zh_Hans**

               部分固件无法启动，可以尝试设置数据目录为外置存储设备里

            tag_name: ${{ env.tag }}
            files: /opt/openwrt-sdk*/bin/packages/*/*/*.ipk
