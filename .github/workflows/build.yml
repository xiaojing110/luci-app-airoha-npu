name: 编译 luci-app-airoha-npu

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    name: airoha/${{ matrix.subtarget }} ${{ matrix.format }}
    runs-on: ubuntu-latest
    strategy:
      # 四个组合互相独立，一个失败不要取消其它的
      fail-fast: false
      matrix:
        # 包对 AN7581 和 AN7583 都适用：@TARGET_airoha 是 target 级依赖，
        # 两个子目标都满足它。这里各编一次，确认在 an7583 上也能被选中、能编过。
        subtarget:
          - an7581
          - an7583
        # 25.12 起发行版改用 apk（快照 SDK 默认就是 apk）；ipk 留给 24.10 及
        # 更早的固件。构建系统靠 CONFIG_USE_APK 切换，两条路都在同一份 SDK 里。
        format:
          - apk
          - ipk
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # 语言包的源文件就是 po/，CI 里先确认它和视图还一致。
      - name: 校验语言文件
        run: python3 scripts/gen-po.py --check

      # rpcd 直接 exec 这个脚本，而 luci.mk 用 `cp -pR` 装 root/，所以检出时的
      # 权限决定包里的权限。丢了执行位，rpcd 的 list 跑不起来，对象就没有任何
      # 方法，页面会全是空的（"无法识别的 SoC"）。这里提前挡住。
      - name: 校验 rpcd 脚本权限
        run: |
          if [ ! -x root/usr/libexec/rpcd/luci.airoha_npu ]; then
            echo "root/usr/libexec/rpcd/luci.airoha_npu 没有执行位（应为 100755）。" >&2
            echo "装出来的包 rpcd 无法执行，页面会全是空的。" >&2
            echo "修复：git update-index --chmod=+x root/usr/libexec/rpcd/luci.airoha_npu" >&2
            exit 1
          fi
          ls -l root/usr/libexec/rpcd/luci.airoha_npu

      - name: 下载 airoha/${{ matrix.subtarget }} SDK
        run: |
          set -euo pipefail
          sudo timedatectl set-timezone Asia/Shanghai
          sudo apt-get install -y zstd
          base="https://downloads.openwrt.org/snapshots/targets/airoha/${{ matrix.subtarget }}"
          # 快照文件名里的 gcc 版本会变，取目录里最新的那一个，不要写死。
          # 用 grep -m1 而不是 `| head -n1`：后者会让 grep 吃 SIGPIPE，
          # 配上 set -o pipefail 会莫名其妙地整步失败。
          sdk="$(curl -fsSL "$base/" | grep -m1 -oE 'openwrt-sdk-airoha-${{ matrix.subtarget }}_[^"]+\.tar\.zst')"
          echo "使用 SDK: $sdk"
          curl -fsSL -o /tmp/sdk.tar.zst "$base/$sdk"
          mkdir -p /opt/sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C /opt/sdk

      - name: 放入 package、更新 feed、生成配置
        run: |
          set -euo pipefail
          cd /opt/sdk/openwrt-sdk-*/
          # 整个检出目录就是包本身，不要再取一层 luci-app-airoha-npu/。
          mkdir -p package/luci-app-airoha-npu
          tar -C "$GITHUB_WORKSPACE" \
            --exclude=./.git --exclude=./.github --exclude=./screenshots \
            -cf - . | tar -C package/luci-app-airoha-npu -xf -

          # SDK 里通常只有 feeds.conf.default；scripts/feeds 要的是 feeds.conf。
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a

          # 语言包由 luci.mk 生成，安装阶段要调用 po2lmo。po2lmo 不在 SDK 里，
          # 它由 luci feed 的 luci-base 通过 host build 编进
          # staging_dir/host/bin/，所以 luci-base 必须先被 feeds install 进来。
          ./scripts/feeds install luci-base

          printf '%s\n' \
            'CONFIG_PACKAGE_luci-base=y' \
            'CONFIG_PACKAGE_luci-app-airoha-npu=y' \
            'CONFIG_LUCI_LANG_zh_Hans=y' \
            'CONFIG_LUCI_LANG_es=y' \
            'CONFIG_PACKAGE_luci-i18n-airoha-npu-zh-cn=y' \
            'CONFIG_PACKAGE_luci-i18n-airoha-npu-es=y' >> .config
          # 只动 USE_APK 这一项，SDK 自带的 target/subtarget 选择必须原样保留，
          # 否则 defconfig 会挑回默认目标，包就变成不可选的了。
          if [ -f .config ]; then
            sed -i '/^CONFIG_USE_APK=/d; /^# CONFIG_USE_APK is not set/d' .config
          fi
          if [ "${{ matrix.format }}" = apk ]; then
            echo 'CONFIG_USE_APK=y' >> .config
          else
            echo '# CONFIG_USE_APK is not set' >> .config
          fi
          make defconfig

          if [ "${{ matrix.format }}" = apk ]; then
            grep -qx 'CONFIG_USE_APK=y' .config \
              || { echo 'apk 模式没生效（CONFIG_USE_APK）' >&2; exit 1; }
          else
            grep -qx '# CONFIG_USE_APK is not set' .config \
              || { echo 'ipk 模式没生效（CONFIG_USE_APK）' >&2; exit 1; }
          fi
          grep -E 'CONFIG_USE_APK|CONFIG_LUCI_LANG_(zh_Hans|es)|CONFIG_PACKAGE_luci-i18n-airoha' .config

      - name: 编译
        run: |
          set -euo pipefail
          cd /opt/sdk/openwrt-sdk-*/
          fmt="${{ matrix.format }}"

          # po2lmo / jsmin：luci-base 的 host build，装到 staging_dir/host/bin。
          # 少了这一步，i18n 包会以 `po2lmo: command not found` 失败。
          make package/feeds/luci/luci-base/host/compile V=s -j1
          test -x staging_dir/host/bin/po2lmo \
            || { echo 'luci-base host build 没产出 po2lmo' >&2; exit 1; }
          ls -l staging_dir/host/bin/po2lmo

          # package/<目录>/compile 会把这个 Makefile 里所有已启用的包都编出来：
          # 主程序 + 两个 luci-i18n 包（它们由上面的 CONFIG_LUCI_LANG_* 打开）。
          # 注意不要写 package/luci-i18n-airoha-npu-zh-cn/compile —— OpenWrt 的
          # 编译目标是按目录生成的，语言包没有自己的目录。
          make package/luci-app-airoha-npu/compile V=s -j1

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find bin/packages -name "*airoha-npu*.${fmt}" \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;
          ls -l "$GITHUB_WORKSPACE/artifacts"

          # 三个包缺一不可，少一个发出去的包就没有中文界面。
          # apk 用 `名字-版本.apk`，ipk 用 `名字_版本_架构.ipk`，所以都用 [-_] 兜住。
          for pat in "luci-app-airoha-npu[-_]*.${fmt}" \
                     "luci-i18n-airoha-npu-zh-cn[-_]*.${fmt}" \
                     "luci-i18n-airoha-npu-es[-_]*.${fmt}"; do
            test -n "$(ls "$GITHUB_WORKSPACE"/artifacts/$pat 2>/dev/null)" \
              || { echo "缺少构建产物: $pat" >&2; exit 1; }
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.subtarget }}-${{ matrix.format }}
          path: artifacts/*

  # 三个包都是 Architecture: all（luci.mk 在没有 src/Makefile 时把 PKGARCH 定为
  # all），所以 an7581 和 an7583 同名产物内容等价，合并时自然去重；apk 和 ipk
  # 扩展名不同，会一起发出去。
  release:
    name: 发布
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 收集所有产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -l artifacts

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.c8 }}
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/*.apk
            artifacts/*.ipk
          body: |
            ## luci-app-airoha-npu ${{ github.ref_name }}

            | 文件 | 用于 | 安装 |
            |------|------|------|
            | `luci-app-airoha-npu-*.apk` | OpenWrt **25.12+**（apk） | `apk add --allow-untrusted ./luci-app-airoha-npu-*.apk` |
            | `luci-app-airoha-npu_*.ipk` | OpenWrt **24.10 及更早**（opkg） | `opkg install luci-app-airoha-npu_*.ipk` |
            | `luci-i18n-airoha-npu-zh-cn[-_]*` | 简体中文语言包 | 同上面各自的包管理器 |
            | `luci-i18n-airoha-npu-es[-_]*` | 西班牙语语言包 | 同上 |

            三个包都是 `Architecture: all`，**AN7581 与 AN7583 共用同一份**，不用按
            SoC 挑版本；只要按固件版本挑 `apk` 还是 `ipk`。

            主程序和语言包是两个包，**只装主程序界面会退回英文**：

            ```sh
            # 25.12+ / apk
            apk add --allow-untrusted ./luci-app-airoha-npu-*.apk ./luci-i18n-airoha-npu-zh-cn-*.apk

            # 24.10 及更早 / opkg
            opkg install luci-app-airoha-npu_*.ipk luci-i18n-airoha-npu-zh-cn_*.ipk

            # 然后：系统 -> 系统 -> 语言和界面 选「简体中文」，保存并应用后重新登录
            ```
