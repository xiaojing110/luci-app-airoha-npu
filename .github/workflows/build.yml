name: 编译 luci-app-airoha-npu

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    name: airoha/${{ matrix.subtarget }}
    runs-on: ubuntu-latest
    strategy:
      # 两个子目标都要有结果，一个失败不要取消另一个
      fail-fast: false
      matrix:
        # 包对 AN7581 和 AN7583 都适用：@TARGET_airoha 是 target 级依赖，
        # 两个子目标都满足它。这里各编一次，确认在 an7583 上也能被选中、能编过。
        subtarget:
          - an7581
          - an7583
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # 语言包的源文件就是 po/，CI 里先确认它和视图还一致。
      - name: 校验语言文件
        run: python3 scripts/gen-po.py --check

      - name: 下载 airoha/${{ matrix.subtarget }} SDK
        run: |
          set -euo pipefail
          sudo timedatectl set-timezone Asia/Shanghai
          sudo apt-get install -y zstd
          base="https://downloads.openwrt.org/snapshots/targets/airoha/${{ matrix.subtarget }}"
          # 快照文件名里的 gcc 版本会变，取目录里最新的那一个，不要写死。
          sdk="$(curl -fsSL "$base/" | grep -oE 'openwrt-sdk-airoha-${{ matrix.subtarget }}_[^"]+\.tar\.zst' | head -n 1)"
          echo "使用 SDK: $sdk"
          curl -fsSL -o /tmp/sdk.tar.zst "$base/$sdk"
          mkdir -p /opt/sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C /opt/sdk

      - name: 放入 package 并更新 feed
        run: |
          set -euo pipefail
          cd /opt/sdk/openwrt-sdk-*/
          # 整个检出目录就是包本身，不要再取一层 luci-app-airoha-npu/。
          mkdir -p package/luci-app-airoha-npu
          tar -C "$GITHUB_WORKSPACE" \
            --exclude=./.git --exclude=./.github --exclude=./screenshots \
            -cf - . | tar -C package/luci-app-airoha-npu -xf -
          # SDK 里通常只有 feeds.conf.default；scripts/feeds 要的是 feeds.conf。
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          # 两个语言包是隐藏包（HIDDEN:=1），由 LUCI_LANG_* 选中；.config 里再显式
          # 写一遍包名，两者任意一个生效都行。
          printf '%s\n' \
            'CONFIG_LUCI_LANG_zh_Hans=y' \
            'CONFIG_LUCI_LANG_es=y' \
            'CONFIG_PACKAGE_luci-i18n-airoha-npu-zh-cn=y' \
            'CONFIG_PACKAGE_luci-i18n-airoha-npu-es=y' >> .config
          make defconfig
          grep -E 'CONFIG_LUCI_LANG_(zh_Hans|es)|CONFIG_PACKAGE_luci-i18n-airoha' .config

      - name: 编译
        run: |
          set -euo pipefail
          cd /opt/sdk/openwrt-sdk-*/
          # package/<目录>/compile 会把这个 Makefile 里所有已启用的包都编出来：
          # 主程序 + 两个 luci-i18n 包（它们由上面的 CONFIG_LUCI_LANG_* 打开）。
          # 注意不要写 package/luci-i18n-airoha-npu-zh-cn/compile —— OpenWrt 的
          # 编译目标是按目录生成的，语言包没有自己的目录。
          make package/luci-app-airoha-npu/compile V=s -j1
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find bin/packages -name '*airoha-npu*.ipk' \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;
          ls -l "$GITHUB_WORKSPACE/artifacts"
          # 三个包缺一不可，少一个发出去的 ipk 就没有中文界面。
          for pat in 'luci-app-airoha-npu_*.ipk' \
                     'luci-i18n-airoha-npu-zh-cn_*.ipk' \
                     'luci-i18n-airoha-npu-es_*.ipk'; do
            test -n "$(ls "$GITHUB_WORKSPACE"/artifacts/$pat 2>/dev/null)" \
              || { echo "缺少构建产物: $pat" >&2; exit 1; }
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.subtarget }}
          path: artifacts/*.ipk

  # 三个包都是 Architecture: all（luci.mk 在没有 src/Makefile 时把 PKGARCH 定为
  # all），an7581 和 an7583 编出来的文件名相同、内容等价，所以只在最后合并发布
  # 一次；万一将来某个包变成架构相关，两份不同架构的 ipk 也会一起发出去。
  release:
    name: 发布
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 收集两个子目标的产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -l artifacts

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.c8 }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/*.ipk
          body: |
            ## luci-app-airoha-npu ${{ github.ref_name }}

            | 文件 | 说明 |
            |------|------|
            | `luci-app-airoha-npu_*.ipk` | 主程序（页面、菜单、ACL、RPC 后端） |
            | `luci-i18n-airoha-npu-zh-cn_*.ipk` | 简体中文语言包 |
            | `luci-i18n-airoha-npu-es_*.ipk` | 西班牙语语言包 |

            三个包都是 `Architecture: all`，**AN7581 与 AN7583 共用同一份**，
            不用按 SoC 挑版本。

            主程序和语言包是两个包，**只装主程序界面会退回英文**：

            ```sh
            opkg install luci-app-airoha-npu_*.ipk luci-i18n-airoha-npu-zh-cn_*.ipk
            # 系统 -> 系统 -> 语言和界面 选「简体中文」，保存并应用后重新登录
            ```
